# 工作包 K：可靠性方法的生态位（机器可读版）
# 论文 Discussion 的分工表；`adt.cli landscape` 会输出 CSV/Markdown。
version: 1
thesis: "证据准入先于证据组合：先判某个证据体是否有资格被赋予非零权重，再做组合/校准/区间。"
rows:
  - strategy: "多数投票 / 共识聚合"
    solves: "多个预测的机械汇总"
    does_not_solve: "源间分歧的结构性解释；域外源仍投票"
    relation: "本框架在分歧/域外区域拒绝强行共识"
  - strategy: "适用域 (AD) / 相似性"
    solves: "单个模型的外推检测"
    does_not_solve: "多源之间的独立性与准入资格"
    relation: "AD 信号是本框架的输入之一，不是替代"
  - strategy: "Conformal prediction"
    solves: "exchangeability 下的有限样本覆盖"
    does_not_solve: "分布偏移下的覆盖失效；证据准入"
    relation: "本框架弃权不依赖 exchangeability；conformal 宽度是分数型基线"
  - strategy: "校准 (Platt/isotonic/Brier)"
    solves: "单模型概率可信度"
    does_not_solve: "多源单位异构、版本漂移、域外"
    relation: "校准前必须先过单位/版本/域外准入"
  - strategy: "Dempster-Shafer / WoE (TOXTRUST)"
    solves: "已知证据体之间的冲突组合"
    does_not_solve: "某个证据体是否应被赋予非零 mass"
    relation: "本框架是组合的前置层：先资格判定，再组合"
  - strategy: "本框架 (admet-screening)"
    solves: "证据准入：结构 gate、域外 block、单位守卫、独立组计票、伪共识检测"
    does_not_solve: "regulator-grade PBPK、湿实验真值、晶型/生殖毒性"
    relation: "组合/校准/区间的上游"
