# 主张登记表（CLAIMS_REGISTRY）—— G10 门的唯一真源
#
# 规则的来历（第三轮评审 §B）：
#   v4.2 自查发现 R14/R19/R20 三项标了 ✅，但 `out_gate/`、`out_p8/` **从未生成**。
#   由此立规：**只有代码没有产物的一律降级 🟡**；标 ✅ 必须附产物路径 + 至少一个数字。
#
# 为什么要有这张表（而不是在台账里写路径）：
#   写在 Markdown 表格里的路径与数字**无法被机械校验**——`out_gate/` 不存在也没人拦。
#   本表把每条数字主张绑到①一个产物文件、②一组**字面量 token**，
#   由 `adt.claims_audit.verify_registry()` 逐条核对「文件存在 + token 真的出现在文件里」。
#   这样"空心 ✅"从文档纪律变成**可执行断言**。
#
# 三条填写纪律（违反即门禁失败）：
#   1. `expect` 里必须是**产物文件里逐字存在的字符串**，不是四舍五入后的好看数字；
#   2. 若文档写法与产物字面不同（如 0.269 vs 0.2685），必须写 `doc_rounding` 说明；
#   3. `kind` 为 experiment 的条目，artifact 必须是数据产物（json/csv/npz/log），不得是源码。
#
# 核对方式：python -m adt.claims_audit --registry references/CLAIMS_REGISTRY.yaml

meta:
  version: "v4.4"
  rule: "标 ✅ 必须附产物路径 + 至少一个数字；数字必须是产物内的字面量"
  origin: "第三轮评审 §B（R14/R19/R20 空心 ✅ 事件的制度性修复）"
  verified_by: "adt.claims_audit.verify_registry() → 发布门禁 G10"
  headline_rule: ("对外材料（CLAIMS / README / 汇报）的**第一号数字必须是 tier=headline 的条目**；"
                  "把平均情形的有利数字放前面、把 post-cutoff 0.581 放附录，视为选择性呈现。"
                  "校验：claims_audit 会断言 tier=headline 的条目存在且**恰好一条**。")

