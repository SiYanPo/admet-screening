# ---- 化学类 -> 源白名单（本项目的核心资产，每遇到新化学类都要重算） ----
chemical_classes:
  cinnamoyl_glycoside:
    description: "肉桂酰（香豆酰/咖啡酰/阿魏酰）与葡萄糖的甘油酯，含邻苯二酚亚类"
    trusted_for_decision:
      - "vNN 的 hERG / MMP（9/14 在域内，全阴）"
      - "ProTox 的 DILI / Ames 方向（相对量，绝对值不可比）"
      - "ADMET-AI 的 hERG（14/14 <0.5，与 ADMETlab 一致）"
      - "本机 E3（ALPB 溶剂化）/ E4（xTB BDE）/ E5（可及性）"
    background_only: [admetasar3, toxric, deeppurpose]   # v2.2：修正拼写 admet_asar3->admetasar3，删除伪源名 admet_ai_most_endpoints（ADMET-AI 仅部分端点作背景，按端点级 blocked_endpoints_in_class 管理）
    forbidden: [admetlab3.DILI, admetlab3.Ames, admetlab3.OATP1B1, admetlab3.OATP1B3,
                admetlab3.NR-ER, deeppurpose.caco2, deeppurpose.aqsoldb, biotransformer]
    key_risks:
      - "Michael 受体（全部 14 个）：α,β-不饱和酯"
      - "邻苯二酚（C/E/K/L/M）：COMT 快速甲基化 + 氧化成醌后共价结合"
      - "酯键 + 糖苷键的化学不稳定性（口服第一关，未测）"

# ---- 靶点侧元数据（S-1 思想：受体形态决定结论的适用范围） ----
targets:
  DP1_PTGDR:
    receptor: "前列腺素 D2 受体（GPCR）"
    structures:
      - pdb: "8ZVZ"
        chain: "D"
        cocrystal_ligand: "A1AF8 (BW245C, agonist)"
        conformational_state: "active-like（激动剂结合态）"
        usage_limit: "适合激动剂/内源配体的结合比较；用做拮抗剂筛选存在激活态口袋偏差（未量化）——引用结论时必须带此限制"
        source_facts:
          - "D 链含 BRIL 融合标签；共晶配体经 PDB CCD 核对 C19H32N2O5"
          - "受体 2391 原子 / 306 残基；bw245c redocking best RMSD 1.09 Å（外部线实测）"
