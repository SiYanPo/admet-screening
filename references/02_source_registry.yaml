# ADMET 数据源登记表
# 所有 status / 数值 / 坑 都是 2026-10-27 在本机实测的结果，不是文档抄来的。
# 接入新源前必须：① 用 assets/controls/controls.csv 跑对照；② 把结论写回本文件。
version: 2
verified_at: "2026-10-27"

# independence_group：方法学族 + 训练数据生态重叠。跨源计票时同组只记 1 独立票。
# 分组依据（本机 2026-10-27 实测归纳）：descriptor_ml 两源喂同类描述符模型；neighbor_qsar 两源
# 都依赖训练集近邻。deep_learning 的编码（Morgan/MPNN/CNN）与两者不同，单列。
sources:

  - name: admetlab3
    label: ADMETlab 3.0
    url: https://admetlab3.scbdd.com
    status: ok
    independence_group: descriptor_ml   # 同组多源同向只记 1 独立票（两票半原则）
    interface: web-form
    endpoints_count: 122
    adapter: adt/adapters/admetlab3.py   # v2.2 收编（2026-10-28 实测：CSRF 通过、POST 429→退避生效；解析/下载沿用已验证的 w1 路径）
    rate_limit: "连续提交会 429，需要指数退避（实测 0/90/240/420/600/900/1200 s）"
    pitfalls:
      - "结果页含 href=/server/result/<id>/download/csv，用正则抓 16 位以上 id"
      - "行序不可假设，必须用 canonical SMILES 对齐分子名（A 与 L 的 raw_smiles 前缀相同）"
      - "122 列里没有 CYP 诱导端点"
      - "转运体只有 OATP1B1/1B3/BCRP/BSEP/MRP1，无 MATE/OCT"
    blocked_endpoints_in_class:
      cinnamoyl_glycoside:
        - {endpoint: DILI, evidence: "14/14 >0.5，区间 0.643–0.914"}
        - {endpoint: Ames, evidence: "14/14 >0.5，区间 0.830–0.990"}
        - {endpoint: OATP1B1, evidence: "14/14 >0.5，区间 0.986–0.99998"}
        - {endpoint: OATP1B3, evidence: "14/14 >0.5，区间 0.987–0.99999"}
        - {endpoint: NR-ER, evidence: "14/14 >0.5，区间 0.623–0.949"}
        - {endpoint: BCRP, evidence: "0/14 >0.5，区间 0.009–0.307"}
        - {endpoint: BSEP, evidence: "0/14 >0.5，区间 0.0015–0.285"}
        - {endpoint: MRP1, evidence: "0/14 >0.5，区间 0.0008–0.042"}
        - {endpoint: NR-AhR, evidence: "0/14 >0.5，区间 0.003–0.155"}
    usable_endpoints_in_class: [NR-AR-LBD, SR-p53, SR-ARE, hERG, H-HT, Fu]
    note: "整表 108 个数值端点里 66 个在本集合内无区分度（saturated_in_set），42 个可用"
    corroboration_20261027:
      - "外部独立工作线用相同流程（CSRF -> /server/screeningCal, method=2）跑通 14/14 —— 两线互证"
      - "官方 JSON API（api/admet、api/admetCSV）已被攻击停用 404，只有表单端点活着"
      - "独有产出：fu 预测 22-43%（推翻 fu≈0.99 假设）；Caco-2 -6.46~-5.79 全低于吸收阈 -5.15；hia 0.03-0.23；P-gp 底物 N=0.88"
      - "无微粒体稳定性端点（缺口）"

  - name: admet_ai
    label: ADMET-AI (Chemprop-RDKit)
    url: https://admet.ai.greenstonebio.com
    status: ok
    independence_group: descriptor_ml   # 同组多源同向只记 1 独立票（两票半原则）
    interface: "web-form (multipart: input-type=text, text-smiles)"
    endpoints_count: 41
    adapter: adt/adapters/admet_ai.py    # v2.2 收编（2026-10-28 实测 2/2 对齐）；v2.3.4 起支持 --local 本地离线
    offline: "web --local：admet-ai 2.0.1 + chemprop 2.3.1（pharma-tools/envs/admetai_local），死代理下实测可推理"
    version_note: "**本地 2.0.1-local 与网页 2.0 权重不同**：分类端点一致，回归端点系统性偏移（Caco2 +0.53 log / PPBR −3.5%，C74）"
    pip_offline: "admet-ai==2.0.1（阿里云镜像可装，可完全离线）"
    pitfalls:
      - "percentile 列是相对 DrugBank 参考分布，会随原始预测值变化，必须一起 splice"
      - "不是纯 2D 描述符：位置异构体真 M vs 旧 M 有 41/49 个原始端点在动（≤0.03）"
      - "'同分异构所以不用重跑'是错的"
    blocked_endpoints_in_class:
      cinnamoyl_glycoside:
        - {endpoint: DILI, evidence: "0/14 >0.5，区间 0.226–0.322（近饱和阴性）"}
        - {endpoint: AMES, evidence: "7/14 >0.5，区间 0.339–0.648，与 ADMETlab 方向相反"}

  - name: protox3
    label: ProTox-III
    url: https://tox.charite.de/protox3/
    status: ok
    independence_group: neighbor_qsar   # 同组多源同向只记 1 独立票（两票半原则）
    interface: "web-form (smilesString 字段要填 **molblock 文本**，不是 SMILES)"
    endpoints_count: 18
    adapter: adt/adapters/protox3.py     # v2.2 收编（2026-10-28 实测 APAP：LD50 338、DILI=1、mutagen=0，与试点一致）
    rate_limit: "同会话连提 8 个分子后限流（server_id 与 LD50 全空）；每分子新建 Session + 间隔 3 s"
    pitfalls:
      - "Probability 是**该预测类别的置信度**，不是阳性概率（反例：dili_pred=0 而 prob=0.975）"
      - "无实测近邻的化合物 LD50 一律 5000 / class 5，无区分力"
      - "tox-new.charite.de 已废（404）"
    in_class_facts:
      cinnamoyl_glycoside:
        - "DILI 阳性只有 A（置信度 0.693），13/14 为 0"
        - "心脏毒性阳性 F/L/N（0.72/0.50/0.66）"

  - name: vnn_admet
    label: vNN-ADMET
    url: https://vnnadmet.bhsai.org/vnnadmet/
    status: ok
    independence_group: neighbor_qsar   # 同组多源同向只记 1 独立票（两票半原则）
    adapter: adt/adapters/vnn.py        # v2.2.1 **已端到端验证**（2026-10-28：登录→ALTCHA→提交→轮询 89 s→2 分子 8 行）；人工桥保留为降级通道
    credentials: "环境变量 VNN_USER/VNN_PASS，或 ~/.workbuddy/vnn_cred.json（username/password）"
    interface: "web-form + ALTCHA proof-of-work；需注册登录（注册页 4 字段、无验证码，密码由站方邮件下发）"
    verified_20261028:
      - "登录 POST /login（username/password）→ home.xhtml 200 才算真登录"
      - "提交后 `<redirect ...checkjob.xhtml?myjob=hash>`；2 分子作业 89 s 出结果"
      - "**C65：就绪判据必须用提取器（parse_checkjob 能拿到预期行数），不能用正则数 33-td——2 分子页是嵌套表，正则法会误判'未就绪'（实测白等 6 分钟）**"
      - "**C66：移植时 _viewstate 必须取 j_idt32 表单内最后一个、_total 必须匹配 'Total query compounds' 文案——按理解重写会 total 恒 0 直接失败**"
      - "**14 分子重跑（2026-10-28，分 10+4 两批）：与 2026-10-27 逐格一致 210/210，覆盖率同为 0.112 → 批次稳定**"
    endpoints_count: 15
    is_only_applicability_domain_source: true
    pitfalls:
      - "bean 是 @ViewScoped：每加一个化合物前重新 GET 会清空列表，必须同一视图连续 postback"
      - "submit 必须 ajax（PrimeFaces.ab），普通 POST 会消耗视图"
      - "单次作业上限 10 个化合物"
      - "结果行 33 个 td = 两套并排，取隐藏列并与可见列逐格交叉校验"
      - "**就绪判据**：未完成页与完成页都含端点表头 + 化合物列表 + 12 个 NoPrediction，正则数 <td> 会被嵌套子表骗成 0；唯一可靠判据是 parse_one() 不抛异常"
    in_class_facts:
      cinnamoyl_glycoside:
        - "10/15 端点对全部 14 个分子 NoPrediction"
        - "平均覆盖率 0.17（15 端点含 MRTD，36/210）；官方 10 折 CV 0.73，差 4.3 倍"
        - "DILI 只有 A 可判（Yes），其余 13 个 NoPrediction"

  - name: deeppurpose
    label: DeepPurpose (16 端点 × 3 编码)
    url: local
    status: ok
    independence_group: deep_learning   # 同组多源同向只记 1 独立票（两票半原则）
    interface: "local (python)"
    pitfalls:
      - "模型缓存跟 cwd 走：在别的目录跑会重新下载 48 个模型"
      - "caco2_cnn 对 14/14 只在 −5.8082/−5.8083 两值 → 该编码失效"
      - "caco2_mpnn 下探到 −13.41（log Papp 物理不可能）"
      - "aqsoldb 三编码极差均值 7.42、最大 26.60 log 单位"
    blocked_endpoints_in_class:
      cinnamoyl_glycoside:
        - {endpoint: caco2_cnn, evidence: "≤2 个不同值"}
        - {endpoint: caco2_mpnn, evidence: "越物理边界 −13.41"}
        - {endpoint: aqsoldb, evidence: "三编码分歧 7.42–26.60 log 单位"}
    verdict_in_class: "16 端点中 10 个 UNUSABLE，只作背景"

  - name: biotransformer
    label: BioTransformer 3.0
    url: https://biotransformer.ca
    status: ok
    independence_group: rule_engine   # 同组多源同向只记 1 独立票（两票半原则）
    interface: "**REST API 可用**"
    adapter: adt/adapters/biotransformer.py
    api:
      submit: "POST https://biotransformer.ca/queries.json（Content-Type 与 Accept 都要 application/json；用 requests 的 json= 会 406，必须 data=json.dumps；allow_redirects=False）"
      submit_success: "302 + Location: /queries/<id>/status（**不是 200**）"
      fetch: "GET https://biotransformer.ca/queries/<id>.json -> status=='Done'"
      payload: "{biotransformer_option, number_of_steps, query_input: 'name\\tSMILES', task_type: 'PREDICTION'}"
      rate_limit: "2 次 POST/分钟（官方明示）"
    coverage_test:
      negative_controls_ok:
        - {compound: acetaminophen, option: CYP450, metabolites: 6}
        - {compound: phenol, option: CYP450, metabolites: 2}
        - {compound: toluene, option: CYP450, metabolites: 3}
      fails_for_this_class:
        - {compound: caffeic_acid, option: CYP450, metabolites: 0}
        - {compound: caffeic_acid, option: PHASEII, metabolites: 0}
        - {compound: caffeic_acid, option: ALLHUMAN, metabolites: 0}
        - {compound: M_true_glycoside, option: CYP450, metabolites: 0}
        - {compound: p_coumaric_acid, option: CYP450, metabolites: 2, problem: "产物化学上荒谬：'2-O-Acylation of 1-monoacylglycerol' 产出咖啡酸"}
    blocked_classes:
      - {class: cinnamoyl_glycoside, reason: "CYP450/PHASEII/ALLHUMAN 规则对该类无覆盖；0 产物必须记 out_of_domain，不可读作'无代谢'"}
    rule: "任何 0 产物结果，必须先跑同 option 的阳性对照；对照 >0 而待测 =0 -> out_of_domain"
    verified_20261104:
      - "option 枚举从 https://biotransformer.ca/queries/new 的 <option value> 实取，共 12 个：CYP450 / ECBASED / PHASEII / HGUT / ENVMICRO / ALLHUMAN / SUPERBIO / MULTIBIO / ABIOTICBIO / Combined / Rule Based / CyProduct"
      - "**HGUT（Human Gut Microbial）实测可用**：acetaminophen -> 3 个唯一代谢物（阳性对照，固定期望值）；quercetin -> 7 个"
      - "**reaction_type 是规则名、不是机理描述**：acetaminophen 的葡糖醛酸苷被标 'Decarboxylation of aromatic L-amino acid'（Δm=+176.03，方向与标签矛盾）；quercetin 有 2 条标 'Hydroxylation' 而产物实际少一个 O（Δm=−15.99）。实测 7/7 条标注与质量差不符 → **只可引用 smiles/inchikey**"
      - "**biosystem 过滤是必需的**：同一次 HGUT 查询里出现了一条 biosystem='Human'（儿茶酚 O-甲基化），不过滤就会把人体代谢算成菌群代谢"
      - "原始响应可用 `adt.cli gut-micro --dump-raw` 落盘审计（bt_raw_<cid>.json）"
    submodule: "adt/gut_microbiome.py（`adt.cli gut-micro`）：HGUT + biosystem 过滤 + 反应标注一致性 QC + 阳性对照闸门"

  - name: xenosite
    label: XenoSite
    url: https://xenosite.org
    status: license_required
    independence_group: dl_atomwise   # 同组多源同向只记 1 独立票（两票半原则）
    interface: "网页免费（学术/非商业）；**程序化 API 需商业许可**"
    adapter: adt/adapters/xenosite.py
    models:
      reactivity: https://xenosite.org/reactivity
      quinone: https://xenosite.org/quinone      # 邻苯二酚 -> 邻醌，本类最关键
      ndealk: https://xenosite.org/ndealk
      epoxidation: https://xenosite.org/epoxidation
      phase1: https://xenosite.org/phase1
      ugt: https://xenosite.org/ugt
    terms_quote: "Licenses are available for secure commercial access and access to the programatic API."
    note: "前端是 Qwik + RDKit-WASM，无公开 REST 端点（/api、/apiv2 均 404）。本适配器只做 task 生成 + 人工回填，不模拟网页提交（等于绕过许可）。"

  - name: admetasar3
    label: admetSAR 3.0
    url: http://lmmd.ecust.edu.cn/admetsar3/
    status: needs_probe
    independence_group: legacy_qsar   # 同组多源同向只记 1 独立票（两票半原则）
    interface: "PHP 表单（服务端渲染，无 JS 框架）"
    verified_http: 200
    adapter: null
    probed:
      - "GET /admetsar3/predict.php -> 200，页面含两个 form，action=predict_submit.php，method=POST，其中一个 enctype=multipart/form-data"
      - "字段：smiles-single（文本）或 smiles-multi（.txt 文件）"
      - "POST predict_submit.php（urlencoded，smiles-single）-> 200，返回页只有 Notice + 一个再查表单，**没有作业链接**"
      - "POST 同上但 multipart -> 302 回 predict_submit.php（验证未通过）"
      - "结果页原文：'Results now require the private link issued when a job is submitted'，查询表单要 id-input(Job ID) + access_key"
    blocker: "二轮探测（2026-10-27）：POST 被接受（响应显示 'You can submit 99 more job(s) today'）但响应里**没有** private link，也无 script 块；Chrome 无头渲染表单页后 DOM 与源码完全一致（无隐藏字段、无 JS 注入字段）。access_key 的发放路径未知（可能邮件/可能服务端条件未满足）——**不要写适配器硬凑**"
    note: "端点口径与 ADMETlab 不同，不要混用；未做对照集校准前只作背景"
    next_step: "用 Chrome --headless 提交并截图/抓 DOM，确认 access_key 的生成位置"

  - name: predherg
    label: Pred-hERG
    url: https://predherg.labmol.com.br
    status: needs_probe
    independence_group: herg_specialist   # 同组多源同向只记 1 独立票（两票半原则）
    interface: "Next.js 应用（/_next/static/*），无服务端表单"
    verified_http: 200
    adapter: null
    probed:
      - "首页 200 / 53 KB，无 <form>/<input>/<textarea>"
      - "静态资源全是 /_next/static/chunks/*.js，说明提交走前端 fetch"
    blocker: "没有公开的 API 文档，猜测 /api/* 端点属于逆向；本轮不猜"
    note: "只有 hERG，专而窄，正好用来给'全系列 hERG 全阴'做第二个独立源"
    next_step: "Chrome --headless 提交一次并抓 network（可导出 HAR），拿到真实 endpoint 再写适配器"

  - name: toxric
    label: TOXRIC
    url: https://toxric.bioinforai.tech
    status: needs_probe
    independence_group: database   # 同组多源同向只记 1 独立票（两票半原则）
    interface: "SPA（首页仅 740 字节 + 高德地图脚本）"
    verified_http: 200
    adapter: null
    probed:
      - "首页 740 字节，只有 webapi.amap.com/maps 脚本，没有任何表单或内容"
      - "实际应用很可能挂在子路径或子域名"
    blocker: "入口位置未确定；先定位真实入口再议"
    note: "端点很多但训练集偏药物样，糖苷要核适用域"

  - name: swissadme
    label: SwissADME
    url: https://www.swissadme.ch
    status: ok
    independence_group: descriptor_rules   # 同组多源同向只记 1 独立票（两票半原则）
    interface: web-form（一次 1 个分子）
    verified_http: 200
    adapter: "adt/readback.py（**回填通道**，不是爬虫）"
    verified_20261104:
      - "GET https://www.swissadme.ch/ -> 200（42909 B），表单 action=index.php 存在"
      - "GET /index.php -> **403**（bot 防护）；自动化提交不可用，且站点未提供 API/批量接口"
      - "因此只能人工在浏览器里跑 → 导出 CSV → `adt.cli readback --source swissadme`"
    fills_gaps:
      - "**P-gp 底物**：三个计算源里 ADMET-AI 只给抑制剂、ADMETlab 本类 14/14 恒为 N、vNN 全 NoPrediction → SwissADME 是目前唯一可批量取的第二个底物来源"
      - "五套 logP（iLOGP/XLOGP3/WLOGP/MLOGP/SILICOS-IT）+ BOILED-Egg：与 descriptor_ml **不同族**，可作跨族一致性检查"
    note: >
      共识 logP/logS、BOILED-Egg、PAINS、合成可及性；不做批量。
      ⚠ 它是 **descriptor_rules 族**：与 ADMETlab/ADMET-AI（descriptor_ml）不同族，
      所以能提供**跨族**互证；但它的五个 logP 彼此同族，**不得**当成五个独立源。
      回填 schema 见 references/readback_schemas.yaml；列名不符时用 `--map` 显式覆盖。

  - name: chembl
    label: ChEMBL
    url: https://www.ebi.ac.uk/chembl/
    status: ok
    independence_group: experimental_truth   # 同组多源同向只记 1 独立票（两票半原则）
    interface: "REST API（无需 key）"
    verified_http: 200
    adapter: adt/adapters/chembl.py
    role: "外部真值 + **适用域指标**：邻居数/最大 Tanimoto 直接回答'这个分子有没有同系物数据'"
    api:
      similarity: "GET /chembl/api/data/similarity/{urlencoded_smiles}/{40-100}.json?limit=N —— 返回 {molecules:[...], page_meta:{total_count}}"
      similarity_range: "**阈值只允许 40–100**；传 30 会 400（'Invalid Similarity Score supplied: 30. It should be between 40 and 100'）"
      similarity_pitfall: "老的 `molecule.json?molecule_structures__canonical_smiles__similarity=...&similarity=70` 会 500（'CharField' object has no attribute 'get_related_resource'），不要用"
      similarity_has_no_score: "返回的 molecule 里**没有 Tanimoto 分数**，只有 canonical_smiles；最大相似度要本地用指纹算"
      activity: "GET /activity.json?molecule_chembl_id__in=CHEMBL25,CHEMBL112&limit=1000 —— `__in` 逗号分隔可用"
      herg: "同一 activity 接口加 target_chembl_id=CHEMBL240"
      activity_fields: "molecule_chembl_id / standard_type / standard_value / standard_units / assay_chembl_id"
    measured_facts:
      cinnamoyl_glycoside:
        - {compound: M_true, tanimoto40_neighbors: 537, max_tanimoto: 0.676, nearest: CHEMBL479699_PUBESCENOSIDE_A, tanimoto70_neighbors: 0}
        - "结论：Tanimoto>=70 的邻居为 0，但 40% 档有 537 个同类糖苷 —— **适用域用 40% 档判断，用 70% 档会误判为'完全无参考'**"

  - name: pkcsm
    independence_group: null   # dead/redundant，不参与计票
    label: pkCSM
    url: https://biosig.lab.uq.edu.au/pkcsm/   # 2026-11-04：站点已从 unimelb 迁到 UQ（301）
    old_url: http://biosig.unimelb.edu.au/pkcsm/
    status: dead
    evidence: "服务端 500，http/https 共 5 次实测；/pkcsm/run_example 静态页 200 但提交结果页 500"
    note: >
      **不要再接入**。多份 AI 分析仍把它列为可用免费工具，实测已死。
      **2026-11-04 复测（第三次，地点已变）**：域名迁移到 UQ 后，前端全活、
