# requirements.lock —— 精确钉版（2026-11-05 本机实测逐项回填，非凭记忆）
# 生成方式：python -c "from importlib.metadata import version; ..." 实测后回填
# 注意 rdkit 的 PyPI 规范版本是 2026.9.1，而 rdkit.__version__ 打印 2026.09.1；
#       两者是同一个包，钉版必须用 PyPI 规范名（已用 pip --dry-run 验证可解析）。
# 安装：python bootstrap.py   （多镜像 fallback + 429 退避 + 产物可用性校验）
#       或手工：pip install -r requirements.lock -i https://repo.huaweicloud.com/repository/pypi/simple/
# 镜像事实（2026-11-05 实测）：pypi.org 索引 200 但 wheel 下载停滞（dry-run 3 分钟零输出）；
#   华为云 7.5 MB/s 可用；高频请求会短暂 429，冷却后恢复；阿里云 / TUNA 为备选。
# 本文件只钉**核心运行期**依赖。可选层见 requirements-optional.txt，
#   两者分开是硬要求：把 pytdc 混进必需依赖会让 pip 强制降级 numpy/pandas/rdkit。
# 2026-11-05 修正：旧 lock 停在 2026-10-31 环境（rdkit 2026.3.6 / pandas 2.3.3），
#   与 2026-11-03 环境漂移后的实测栈（2026.9.1 / 3.1.0）不符，按旧 lock 装会复现出不同数字。
